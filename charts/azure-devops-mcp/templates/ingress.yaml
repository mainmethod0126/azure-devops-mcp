{{- if .Values.ingress.enabled }}
{{- if eq (len .Values.ingress.hosts) 0 }}
{{- fail "values.ingress.hosts must contain at least one host when ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "azure-devops-mcp.fullname" . }}
  labels:
    {{- include "azure-devops-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ required "values.ingress.hosts[].host is required" .host | quote }}
      http:
        paths:
          - path: {{ $.Values.http.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "azure-devops-mcp.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
